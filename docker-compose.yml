services:
  app:
    build:
      context: .
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "8888:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
            python manage.py wait_db &&
            python manage.py migrate && 
            python manage.py runserver 0.0.0.0:8000
      "
    restart: on-failure

  celery:
    build:
      context: .
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "celery -A config worker -l info"
    restart: on-failure

  celery-beat:
    build:
      context: .
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "celery -A config beat -l info"
    restart: on-failure

  db:
    image: mysql:8
    env_file:
      - .env
    ports:
      - "3308:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  redis:
    image: redis:alpine
    restart: on-failure