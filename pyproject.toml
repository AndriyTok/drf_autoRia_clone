[project]
name = "drf-autoria-clone"
version = "0.1.0"
description = "auto ria clone"
authors = [
    {name = "andriytok",email = "andriy.tokovyy@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "daphne (>=4.2.2,<5.0.0)",
    "djangorestframework-simplejwt (>=5.4.0,<6.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "celery-types (>=0.26.0,<0.27.0) ; python_version >= \"3.13\" and python_version < \"4\"",
    "channels (>=4.3.2,<5.0.0)",
    "channels-redis (>=4.2.1,<5.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-filter (>=24.3,<25.0)",
    "requests (>=2.31.0,<3.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "pillow (>=10.0.0,<11.0.0)",
    "djangorestframework-stubs (>=3.18.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false